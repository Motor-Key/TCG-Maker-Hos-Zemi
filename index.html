<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自作TCG オリジナルカードジェネレーター v8 (スマホ完全対応版)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            padding: 20px;
            gap: 30px;
            /* スマホ操作時の不自然なハイライトを防止 */
            -webkit-tap-highlight-color: transparent;
        }
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .control-panel label {
            font-weight: bold;
            font-size: 13px;
            color: #444;
            margin-bottom: -4px;
        }
        .control-panel input[type="text"], .control-panel textarea, .control-panel input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .control-panel input[type="range"] {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .control-panel textarea {
            height: 80px;
            resize: vertical;
        }
        .burst-panel {
            display: none;
            flex-direction: column;
            gap: 12px;
            background-color: #fcfcfc;
            border: 2px dashed #ccc;
            padding: 12px;
            border-radius: 6px;
            margin-top: 5px;
        }
        .burst-panel textarea {
            height: 60px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            transition: 0.2s;
        }
        .checkbox-label:hover {
            background-color: #dde2e6;
        }
        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .preview-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        canvas {
            background-color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-radius: 16px;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            height: auto;
            /* スマホでドラッグ中に画面全体がスクロールしてしまうのを防ぐ */
            touch-action: none; 
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .help-text {
            font-size: 11px;
            color: #888;
            margin-top: -8px;
            margin-bottom: 4px;
        }
        .notice {
            font-size: 12px;
            color: #d9534f;
            font-weight: bold;
            background-color: #fdf7f7;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #f2dede;
        }
        code {
            background-color: #eee;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }

        /* スマホ向けのレスポンシブ対応 */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* 縦並びに変更 */
                padding: 10px;
            }
            .control-panel {
                width: 100%;
                max-height: none; /* スマホではスクロールバーを分けない */
                box-sizing: border-box;
            }
            .preview-panel {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- プレビュー画面をスマホでは一番上に持ってくる（CSSのorderプロパティの代わり） -->
    <div class="preview-panel">
        <canvas id="cardCanvas" width="650" height="908"></canvas>
    </div>

    <div class="control-panel">
        <h2>カード情報入力</h2>
        
        <label>ルビ（ふりがな）</label>
        <input type="text" id="cardRuby" value="ここにルビを入力">

        <label>カード名</label>
        <input type="text" id="cardName" value="ここに名前を入力">
        
        <label>カードイラスト</label>
        <div class="notice">💡 画像枠の中をドラッグ（スワイプ）すると切り抜き位置を調整できます！</div>
        <input type="file" id="imageInput" accept="image/*">
        
        <label>イラスト拡大・縮小</label>
        <input type="range" id="imageZoom" min="1" max="3" step="0.01" value="1">
        
        <label>種類・特性</label>
        <input type="text" id="cardType" value="サモン / 特性">
        
        <label>合計コスト (数字)</label>
        <input type="text" id="totalCost" value="7">

        <label>色コスト</label>
        <div class="help-text">「赤赤赤」など漢字で入力（赤,青,黄,緑,橙,紫）</div>
        <input type="text" id="colorCost" value="赤赤赤赤赤">
        
        <label>通常効果テキスト</label>
        <div class="help-text">※ <code>[赤]文字[/赤]</code> のように囲むと色が変わります。(赤,青,緑,黄,橙,紫)</div>
        <textarea id="cardEffect">ここにテキストを入力</textarea>
        
        <!-- バースト機能切り替えスイッチ -->
        <label class="checkbox-label">
            <input type="checkbox" id="enableBurst"> 
            💥 バースト効果エリアを追加する
        </label>
        
        <!-- バースト設定パネル -->
        <div class="burst-panel" id="burstPanel">
            <label>バースト種類 (例: 【バースト：AB】)</label>
            <input type="text" id="burstType" value="【バースト：AB】">
            
            <label>バースト合計コスト (数字)</label>
            <input type="text" id="burstTotalCost" value="3">
            
            <label>バースト色コスト (漢字)</label>
            <input type="text" id="burstColorCost" value="赤赤赤">
            
            <label>バースト効果テキスト</label>
            <div class="help-text">※ <code>[青]文字[/青]</code> のように色指定タグが使えます。</div>
            <textarea id="burstEffect">ここにバーストテキスト</textarea>
        </div>
        
        <label>パワー</label>
        <input type="text" id="cardPower" value="8000">
        
        <label>打点</label>
        <input type="text" id="cardDamage" value="7">

        <button id="downloadBtn">画像を保存 (PNG)</button>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        let cardImage = null;

        let imgOffsetX = 0;
        let imgOffsetY = 0;
        let isDragging = false;
        let startX, startY;

        const inputs = [
            'cardRuby', 'cardName', 'cardType', 'totalCost', 'colorCost', 'cardEffect', 
            'cardPower', 'cardDamage', 'imageZoom', 'enableBurst', 
            'burstType', 'burstTotalCost', 'burstColorCost', 'burstEffect'
        ];
        
        inputs.forEach(id => {
            if (id === 'enableBurst') {
                document.getElementById(id).addEventListener('change', (e) => {
                    document.getElementById('burstPanel').style.display = e.target.checked ? 'flex' : 'none';
                    drawCard();
                });
            } else {
                document.getElementById(id).addEventListener('input', drawCard);
            }
        });

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        cardImage = img;
                        document.getElementById('imageZoom').value = 1;
                        
                        const scale = Math.max(580 / img.width, 390 / img.height);
                        imgOffsetX = (580 - (img.width * scale)) / 2;
                        imgOffsetY = (390 - (img.height * scale)) / 2;
                        drawCard();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            } else {
                cardImage = null;
                drawCard();
            }
        });

        // マウス ＆ タッチ の両方の座標を取得する関数
        function getCoords(e) {
            if (e.touches && e.touches.length > 0) {
                return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
            }
            return { clientX: e.clientX, clientY: e.clientY };
        }

        function handleStart(e) {
            if (!cardImage) return;
            const coords = getCoords(e);
            const rect = canvas.getBoundingClientRect();
            const x = (coords.clientX - rect.left) * (canvas.width / rect.width);
            const y = (coords.clientY - rect.top) * (canvas.height / rect.height);

            if (x >= 35 && x <= 615 && y >= 155 && y <= 545) {
                isDragging = true;
                startX = x;
                startY = y;
                canvas.style.cursor = 'grabbing';
            }
        }

        function handleMove(e) {
            if (!cardImage) return;
            const coords = getCoords(e);
            const rect = canvas.getBoundingClientRect();
            const x = (coords.clientX - rect.left) * (canvas.width / rect.width);
            const y = (coords.clientY - rect.top) * (canvas.height / rect.height);

            if (!isDragging) {
                if (x >= 35 && x <= 615 && y >= 155 && y <= 545) {
                    canvas.style.cursor = 'grab';
                } else {
                    canvas.style.cursor = 'default';
                }
                return;
            }

            // スマホでのドラッグ中に画面自体がスクロールするのを防ぐ
            if(e.cancelable) {
                e.preventDefault(); 
            }

            const dx = x - startX;
            const dy = y - startY;
            
            imgOffsetX += dx;
            imgOffsetY += dy;
            
            startX = x;
            startY = y;
            
            drawCard();
        }

        function handleEnd() {
            isDragging = false;
            canvas.style.cursor = 'default';
        }

        // PC向けマウスイベント
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove, { passive: false });
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        // スマホ向けタッチイベント
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('touchcancel', handleEnd);


        // 色タグパーサー
        function wrapTextRich(context, text, x, y, maxWidth, lineHeight, defaultColor) {
            const paragraphs = text.split('\n');
            const colorMap = {
                '赤': '#d9534f', 'red': '#d9534f',
                '青': '#0275d8', 'blue': '#0275d8',
                '緑': '#5cb85c', 'green': '#5cb85c',
                '紫': '#8e44ad', 'purple': '#8e44ad',
                '橙': '#f39c12', 'orange': '#f39c12',
                '黄': '#f0ad4e', 'yellow': '#f0ad4e'
            };
            
            for (let i = 0; i < paragraphs.length; i++) {
                let p = paragraphs[i];
                let chars = [];
                let currentColor = defaultColor;
                let j = 0;
                
                while (j < p.length) {
                    let match = p.substr(j).match(/^\[(\/?)([^\]]+)\]/);
                    if (match) {
                        if (match[1] === '/') {
                            currentColor = defaultColor; 
                        } else {
                            currentColor = colorMap[match[2]] || defaultColor; 
                        }
                        j += match[0].length;
                        continue;
                    }
                    chars.push({ char: p[j], color: currentColor });
                    j++;
                }

                if (chars.length === 0) {
                    y += lineHeight; 
                    continue;
                }

                let lineStr = "";
                let lineChars = [];
                
                for (let n = 0; n < chars.length; n++) {
                    let c = chars[n];
                    let testLineStr = lineStr + c.char;
                    let metrics = context.measureText(testLineStr);
                    
                    if (metrics.width > maxWidth && n > 0) {
                        drawChunks(context, lineChars, x, y);
                        y += lineHeight;
                        lineStr = c.char;
                        lineChars = [c];
                    } else {
                        lineStr = testLineStr;
                        lineChars.push(c);
                    }
                }
                if (lineChars.length > 0) {
                    drawChunks(context, lineChars, x, y);
                    y += lineHeight;
                }
            }
        }

        function drawChunks(context, lineChars, startX, y) {
            if (lineChars.length === 0) return;
            let chunks = [];
            let currentChunk = { text: '', color: lineChars[0].color };
            
            for (let c of lineChars) {
                if (c.color === currentChunk.color) {
                    currentChunk.text += c.char;
                } else {
                    chunks.push(currentChunk);
                    currentChunk = { text: c.char, color: c.color };
                }
            }
            chunks.push(currentChunk);
            
            let currentX = startX;
            for (let chunk of chunks) {
                context.fillStyle = chunk.color;
                context.fillText(chunk.text, currentX, y);
                currentX += context.measureText(chunk.text).width;
            }
        }

        function drawCard() {
            const ruby = document.getElementById('cardRuby').value;
            const name = document.getElementById('cardName').value;
            const type = document.getElementById('cardType').value;
            const tCostStr = document.getElementById('totalCost').value;
            const cCostStr = document.getElementById('colorCost').value;
            const effect = document.getElementById('cardEffect').value;
            const power = document.getElementById('cardPower').value;
            const damage = document.getElementById('cardDamage').value;
            
            const hasBurst = document.getElementById('enableBurst').checked;

            const colorMap = {
                '赤': '#ff4444',
                '青': '#4444ff',
                '黄': '#ffcc00',
                '緑': '#44aa44',
                '橙': '#ff8800',
                '紫': '#aa44cc'
            };
            
            const lightColorMap = {
                '赤': '#ffeaea',
                '青': '#eaebff',
                '黄': '#fffcea',
                '緑': '#eaffea',
                '橙': '#fff3ea',
                '紫': '#f5eaff',
                'default': '#f9f9f9'
            };

            const firstColorChar = cCostStr.charAt(0);
            const mainColor = colorMap[firstColorChar] || '#cccccc'; 
            const bgLightColor = lightColorMap[firstColorChar] || lightColorMap['default'];

            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.arc(75, 75, 42, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 46px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(tCostStr, 75, 92);
            ctx.textAlign = 'left';

            ctx.fillStyle = '#aaaaaa';
            ctx.font = '20px sans-serif';
            ctx.fillText(ruby, 135, 42);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 40px sans-serif';
            ctx.fillText(name, 135, 88);

            const tCost = parseInt(tCostStr) || 0;
            let circleColors = [];
            for (let char of cCostStr) {
                if (colorMap[char]) {
                    circleColors.push(colorMap[char]);
                }
            }
            while (circleColors.length < tCost) {
                circleColors.push('#ffffff'); 
            }

            const drawCount = Math.max(tCost, circleColors.length);
            for (let i = 0; i < drawCount; i++) {
                const color = circleColors[i] || '#ffffff';
                const cx = 145 + (i * 32); 
                const cy = 125; 

                ctx.beginPath();
                ctx.arc(cx, cy, 14, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx - 4, cy - 4, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }

            if (cardImage) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(35, 155, 580, 390);
                ctx.clip(); 

                const baseScale = Math.max(580 / cardImage.width, 390 / cardImage.height);
                const zoom = parseFloat(document.getElementById('imageZoom').value) || 1;
                const finalScale = baseScale * zoom;

                const scaledW = cardImage.width * finalScale;
                const scaledH = cardImage.height * finalScale;

                const minOffsetX = 580 - scaledW;
                const minOffsetY = 390 - scaledH;

                if (imgOffsetX > 0) imgOffsetX = 0;
                if (imgOffsetX < minOffsetX) imgOffsetX = minOffsetX;
                if (imgOffsetY > 0) imgOffsetY = 0;
                if (imgOffsetY < minOffsetY) imgOffsetY = minOffsetY;

                ctx.drawImage(cardImage, 35 + imgOffsetX, 155 + imgOffsetY, scaledW, scaledH);
                ctx.restore();
            } else {
                ctx.fillStyle = '#333333';
                ctx.fillRect(35, 155, 580, 390);
                ctx.fillStyle = '#666666';
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('NO IMAGE', 325, 360);
                ctx.textAlign = 'left';
            }
            
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#444';
            ctx.strokeRect(35, 155, 580, 390);

            // ==========================================
            // テキスト枠
            // ==========================================
            ctx.fillStyle = bgLightColor;
            ctx.fillRect(35, 565, 580, 250);

            if (hasBurst) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
                ctx.fillRect(35, 715, 580, 100);
            }
            
            ctx.strokeRect(35, 565, 580, 250);

            const traitY = hasBurst ? 595 : 605;
            ctx.fillStyle = '#222222';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText(type, 55, traitY);
            
            const traitLineY = hasBurst ? 605 : 615;
            ctx.beginPath();
            ctx.moveTo(55, traitLineY);
            ctx.lineTo(615, traitLineY);
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (hasBurst) {
                ctx.font = '22px sans-serif';
                wrapTextRich(ctx, effect, 55, 635, 540, 30, '#111111'); 

                ctx.beginPath();
                ctx.moveTo(35, 715);
                ctx.lineTo(615, 715);
                ctx.strokeStyle = '#888888'; 
                ctx.lineWidth = 2;
                ctx.stroke();

                const bType = document.getElementById('burstType').value;
                ctx.fillStyle = '#111111';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText(bType, 55, 745);

                const bTypeWidth = ctx.measureText(bType).width;
                const bIconStartX = 55 + bTypeWidth + 15;
                
                const bTCostStr = document.getElementById('burstTotalCost').value;
                const bCCostStr = document.getElementById('burstColorCost').value;
                const bTCost = parseInt(bTCostStr) || 0;
                let bCircleColors = [];
                for (let char of bCCostStr) {
                    if (colorMap[char]) bCircleColors.push(colorMap[char]);
                }
                while (bCircleColors.length < bTCost) {
                    bCircleColors.push('#ffffff'); 
                }
                
                const bDrawCount = Math.max(bTCost, bCircleColors.length);
                for (let i = 0; i < bDrawCount; i++) {
                    const color = bCircleColors[i] || '#ffffff';
                    const cx = bIconStartX + (i * 22); 
                    const cy = 737; 

                    ctx.beginPath();
                    ctx.arc(cx, cy, 9, 0, Math.PI * 2); 
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = '#000';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(cx - 2, cy - 2, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.fill();
                }

                const bEffect = document.getElementById('burstEffect').value;
                ctx.font = '22px sans-serif';
                wrapTextRich(ctx, bEffect, 55, 775, 540, 30, '#111111');

            } else {
                ctx.font = '24px sans-serif';
                wrapTextRich(ctx, effect, 55, 655, 540, 36, '#111111'); 
            }

            if (power || damage) {
                ctx.fillStyle = '#222222';
                ctx.fillRect(35, 835, 580, 55);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'right';
                
                let statsText = '';
                if (power) statsText += `Power: ${power}`;
                if (damage) statsText += `   打点: ${damage}`;
                
                ctx.fillText(statsText, 600, 874);
                ctx.textAlign = 'left'; 
            }
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            let fileName = document.getElementById('cardName').value;
            if(fileName === "ここに名前を入力" || fileName.trim() === "") {
                fileName = "no_name_card";
            }
            const link = document.createElement('a');
            link.download = `${fileName}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        drawCard();
    </script>
</body>
</html>
